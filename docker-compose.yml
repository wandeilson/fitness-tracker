services:
  db:
    image: postgres:16
    container_name: fitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitnessdb}
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitness} -d ${POSTGRES_DB:-fitnessdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitness-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fitnessdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fitness}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fitness}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-8m6R1vQyX5hN2kL9pT4cB7dF0gJ3sW8a}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitness-frontend
    restart: unless-stopped
    environment:
      PORT: "80"
      API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
